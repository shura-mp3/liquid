[package]
name = "liquid"
version = "0.1.0"
description = "Liquid Glass music visualiser and live lyrics HUD for Windows 10"
authors = ["shura-mp3"]
license = "MIT"
repository = "https://github.com/shura-mp3/liquid"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Blocking HTTP, which suits a dedicated worker thread far better than pulling in an
# async runtime for one small JSON API. Actively maintained, very widely used.
ureq = { version = "3", features = ["json"] }
# The standard Rust FFT. Mature and very widely used; a hand-rolled transform would
# be one more thing to get subtly wrong in the audio hot path.
rustfft = "6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  # Win32
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # WinRT, for Windows.Media.Control (GSMTC) and artwork streams
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
